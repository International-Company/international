<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>لا يوجد اتصال · انترنشونال</title>
    <!--
      Deliberately self-contained: no stylesheet, no font, no script. This is the
      page that shows when the network is gone, so anything it needs to fetch is
      something it cannot have.
    -->
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem calc(1.5rem + env(safe-area-inset-right)) 2rem calc(1.5rem + env(safe-area-inset-left));
        background: #f7f8fa;
        color: #111827;
        font-family: "Segoe UI", "Noto Sans Arabic", Tahoma, system-ui, sans-serif;
        line-height: 1.9;
        text-align: center;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #111827; color: #e5e7eb; }
        .card { background: #1f2937; border-color: #374151; }
        p { color: #9ca3af; }
      }
      .card {
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 16px;
        padding: 2.5rem 1.75rem;
        max-width: 26rem;
        width: 100%;
      }
      /* Typographic, not an image: this is the page that shows when nothing
         can be fetched, so anything it had to download it could not have. */
      .wordmark {
        margin: 0 0 1.25rem;
        font-size: 1.4rem;
        font-weight: 700;
        letter-spacing: .01em;
        color: #0b3b8c;
      }
      @media (prefers-color-scheme: dark) { .wordmark { color: #7ea6f0; } }
      h1 { font-size: 1.25rem; margin: 0 0 .5rem; font-weight: 650; }
      p { margin: 0; color: #6b7280; font-size: .95rem; }
      button {
        margin-top: 1.75rem;
        width: 100%;
        min-height: 48px;
        border: 0;
        border-radius: 12px;
        background: #1d4ed8;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:active { transform: scale(.98); }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="wordmark">انترنشونال</p>
      <h1>لا يوجد اتصال</h1>
      <p>
        الأرصدة والعمليات تُقرأ من الخادم لحظةً بلحظة، ولا يُعرض منها شيء محفوظ —
        رقمٌ قديم عن المال أسوأ من لا رقم.
      </p>
      <button type="button" onclick="location.reload()">إعادة المحاولة</button>
    </main>
  </body>
</html>
