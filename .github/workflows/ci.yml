name: CI

# Everything here runs on Linux, because that is where this system is deployed
# and development happens on Windows. That gap is exactly how a build can pass
# locally and fail in production, so CI closes it on every push.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    name: typecheck, tests, build

    env:
      NODE_ENV: production
      # Only decides the Prisma provider; nothing here connects.
      DATABASE_URL: postgresql://user:pass@unreachable.internal:5432/ci
      AUTH_SECRET: continuous-integration-secret-value-not-a-real-one

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        # Money arithmetic and audit-chain tamper detection — the two places a
        # silent regression would be most expensive.
        run: npm test

      - name: Production build
        run: npm run build

  upgrade:
    runs-on: ubuntu-latest
    name: upgrade rehearsal

    # A real PostgreSQL, because the failure this guards against — a column that
    # cannot be dropped while it holds data — does not exist on an empty database
    # and is not enforced the same way by SQLite. It only appears on a database
    # with history, which until now meant production was where it appeared.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ifms
          POSTGRES_PASSWORD: ifms
          POSTGRES_DB: ifms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ifms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ifms:ifms@127.0.0.1:5432/ifms
      AUTH_SECRET: continuous-integration-secret-value-not-a-real-one

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Rehearse the upgrade
        run: node scripts/ci-upgrade-rehearsal.mjs

  money:
    runs-on: ubuntu-latest
    name: a day at the counter, end to end

    # The same real PostgreSQL, for a different reason: this drives a whole
    # working day through the services — a float handed out, a trade, an evening
    # count that comes up short, and each of the three ways a manager can settle
    # it. What it guards is the property the whole design rests on, that a
    # teller's drawer ends at zero and the office is worth the same afterwards.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ifms
          POSTGRES_PASSWORD: ifms
          POSTGRES_DB: ifms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ifms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ifms:ifms@127.0.0.1:5432/ifms
      AUTH_SECRET: continuous-integration-secret-value-not-a-real-one

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Create the schema
        run: npx prisma db push --skip-generate

      - name: Seed it
        run: npx tsx prisma/seed.ts

      - name: Run a shift end to end
        run: npm run verify:shift

      - name: Break a price, end to end
        # After the shift and on the same database on purpose: an approval has
        # to survive a counter that has already been traded on, not only a
        # freshly seeded one.
        run: npm run verify:price-exception

  image:
    runs-on: ubuntu-latest
    name: production image

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t ifms:ci .

      - name: Start it
        run: |
          docker run -d --name ifms-ci \
            -e DATABASE_URL="postgresql://u:p@127.0.0.1:5432/none" \
            -e AUTH_SECRET="continuous-integration-secret-value-not-a-real" \
            -e JOBS_ENABLED=false \
            -p 3000:3000 ifms:ci

          sleep 20
          echo "--- container log ---"
          docker logs ifms-ci 2>&1 | tail -25

          # With no database reachable, `deploy:start` is expected to stop at
          # the schema step. What this proves is that the image builds, boots,
          # and resolves the right database provider — the deployment is never
          # the first time this Dockerfile has been run.
          #
          # Matched against the pre-deploy step rather than the push behind it,
          # so the assertion does not depend on how far the sequence gets before
          # the missing database stops it.
          if docker logs ifms-ci 2>&1 | grep -qE '\[pre-deploy\] PostgreSQL at|Datasource "db": PostgreSQL'; then
            echo "OK: image starts and targets PostgreSQL"
          else
            echo "FAIL: image did not reach the schema step"
            exit 1
          fi

          # And it must stop there rather than serving against a database it
          # never reached.
          if docker logs ifms-ci 2>&1 | grep -q 'Cannot reach the database at'; then
            echo "OK: refuses to start without its database, and says why"
          else
            echo "FAIL: no clear message about the unreachable database"
            exit 1
          fi

          docker rm -f ifms-ci >/dev/null 2>&1 || true
